name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: pmux-explorer-darwin-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: pmux-explorer-darwin-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: pmux-explorer-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: pmux-explorer-linux-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          LINKER=aarch64-linux-gnu-gcc
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=$LINKER" \
            >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          cp "target/${{ matrix.target }}/release/pmux-explorer" \
            "${{ matrix.asset }}"

      - name: Upload artifact
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" \
              ${{ github.ref_name }})
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" \
              "${PREV_TAG}..${{ github.ref_name }}")
          fi
          {
            echo "body<<EOF"
            echo "## What's Changed"
            echo ""
            echo "$CHANGELOG"
            echo ""
            REPO_URL="https://github.com/${{ github.repository }}"
            COMPARE="${PREV_TAG}...${{ github.ref_name }}"
            echo "**Full Changelog**: $REPO_URL/compare/$COMPARE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        # v3.0.3
        uses:
          softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: pmux-explorer-*

# The fork releases and deploys from the same workflows as upstream.
